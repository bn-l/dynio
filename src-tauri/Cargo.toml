[package]
name = "dynio"
version = "0.1.9"
description = "Dynio"
authors = ["bn-l"]
license = "mit"
repository = ""
default-run = "dynio"
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "test", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0.61"
tauri-plugin-autostart = { version = "2" }
tokio = { version = "1.38.0", features = ["time", "sync", "process", "macros"] }
serde_yaml = "0.9.34+deprecated"
winapi = "0.3.9"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-single-instance = { version = "2" }
log = "0.4"
dirs = "5"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
flexi_logger = "0.25.3"
dotenvy = "0.15.7"
env_logger = "0.10.2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1", version = "2.1.0" }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]

[dev-dependencies]
tempfile = "3.6.0"
tokio-test = "0.4.3"
