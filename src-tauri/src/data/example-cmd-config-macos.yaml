# yaml-language-server: $schema=./cmd-config-schema.json

find:
    command: mdfind
    description: Search files using Spotlight. Use -name for filename search.
    arguments:
        - -name
    hotkeyNumber: 1
    placeholderText: Search files
    noOutputTimeoutMs: 100
    modeConfig:
        mode: list
        displayOptions:
            parseAnsiColors: true
            stderrFilterRegex: "\\[UserQueryParser\\]"
            maxLineLength: 160
            lineSplitter: "\n"
            fontSize: 0.8
        activationOptions:
            activateAction: open
            isPath: true