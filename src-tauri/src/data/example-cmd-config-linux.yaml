# yaml-language-server: $schema=./cmd-config-schema.json

find:
    command: locate
    description: Search files by name using locate database.
    hotkeyNumber: 1
    placeholderText: Search files
    noOutputTimeoutMs: 100
    modeConfig:
        mode: list
        displayOptions:
            parseAnsiColors: true
            maxLineLength: 160
            lineSplitter: "\n"
            fontSize: 0.8
        activationOptions:
            activateAction: open
            isPath: true